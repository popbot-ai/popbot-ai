# Publishes the popbot-host container image to GitHub's registry:
#   ghcr.io/popbot-ai/popbot-host:<version> and :latest
# on a version tag, or by hand from the Actions tab (with any tag).
# The image wraps dist-host/popbot-host.cjs (built here from the tagged
# source) with Node, git and the claude / codex CLIs — see
# docker/host/Dockerfile. Nothing is published on ordinary pushes.
name: Host image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (also tagged latest)
        required: true
        default: manual

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Bundle the daemon
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm run build:host
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.tag }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/popbot-ai/popbot-host:${{ steps.tags.outputs.version }}
            ghcr.io/popbot-ai/popbot-host:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
